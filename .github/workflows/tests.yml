name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest -q
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m build
      - name: Install and smoke-test wheel outside the source tree
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m pip install --force-reinstall --no-deps "$wheel_path"
          cd "$RUNNER_TEMP"
          python -c "from importlib.resources import files; assert files('diffusion_flow_inference.schedule_transfer').joinpath('otflow_external_schedule_catalog.json').is_file()"
          python -c "from pathlib import Path; from diffusion_flow_inference.data.otflow_paths import project_root; assert project_root() == Path.cwd().resolve()"
          dfi-run-schedules --help
          dfi-build-velocity-variation-figure --help
          dfi-build-ptg-figure --help
