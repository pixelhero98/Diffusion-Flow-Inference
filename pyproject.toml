[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-flow-inference"
version = "0.1.0"
description = "Fixed-schedule diffusion-flow time reparameterization toolkit for OTFlow backbones."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Diffusion-Flow-Inference contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
medical = ["pyedflib>=0.1.38"]
plot = ["matplotlib>=3.8,<4"]
test = [
  "build>=1.2",
  "matplotlib>=3.8,<4",
  "pytest>=8",
  "ruff==0.15.21",
]

[project.urls]
Repository = "https://github.com/pixelhero98/Diffusion-Flow-Inference"
Issues = "https://github.com/pixelhero98/Diffusion-Flow-Inference/issues"

[project.scripts]
dfi-run-schedules = "diffusion_flow_inference.evaluation.diffusion_flow_time_reparameterization:main"
dfi-build-velocity-variation-figure = "diffusion_flow_inference.visualization.build_velocity_variation_difficulty_figure:main"
dfi-build-ptg-figure = "diffusion_flow_inference.visualization.build_ptg_observed_gain_figure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diffusion_flow_inference.schedule_transfer" = ["otflow_external_schedule_catalog.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".review-tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
